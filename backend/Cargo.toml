[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
mailcrater-core = { path = "../mailcrater-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23" , features = ["env-filter"]}
anyhow = "1.0.104"
sqlx = { version = "0.8", features = [ "runtime-tokio", "macros", "sqlite", "migrate", "uuid" ] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
chrono = "0.4"

[dev-dependencies]
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "builder", "smtp-transport"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
