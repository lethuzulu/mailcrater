[package]
name = "mailcrater"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23" , features = ["env-filter"]}
mailin = "0.6.5"
anyhow = "1.0.104"
mail-parser = "0.11.9"

[dev-dependencies]
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "builder", "smtp-transport"] }
